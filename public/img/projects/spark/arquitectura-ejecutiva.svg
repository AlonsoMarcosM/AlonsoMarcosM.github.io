<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Big Data catalogue platform architecture</title>
  <desc id="desc">SQL Server, CSV with embedded JSON and Kafka feed Apache Spark batch and streaming jobs orchestrated by Apache Airflow. Spark writes Bronze, Silver and Gold Delta Lake layers stored on MinIO.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#38bdf8"/>
    </marker>
    <style>
      .main { font: 700 50px 'DejaVu Sans', Arial, sans-serif; fill: #f8fafc; }
      .hero { font: 700 64px 'DejaVu Sans', Arial, sans-serif; fill: #f8fafc; }
      .sub { font: 400 30px 'DejaVu Sans', Arial, sans-serif; fill: #94a3b8; }
      .layer { font: 700 44px 'DejaVu Sans', Arial, sans-serif; }
      .box { fill: #0f172a; stroke-width: 4; }
      .flow { fill: none; stroke: #cbd5e1; stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#020617"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.6"/>

  <!-- Sources -->
  <rect class="box" x="70" y="90" width="380" height="170" rx="22" stroke="#60a5fa"/>
  <text class="main" x="260" y="172" text-anchor="middle">SQL Server</text>
  <text class="sub" x="260" y="222" text-anchor="middle">batch</text>

  <rect class="box" x="70" y="365" width="380" height="170" rx="22" stroke="#34d399"/>
  <text class="main" x="260" y="447" text-anchor="middle">CSV + JSON</text>
  <text class="sub" x="260" y="497" text-anchor="middle">batch</text>

  <rect class="box" x="70" y="640" width="380" height="170" rx="22" stroke="#f472b6"/>
  <text class="main" x="260" y="722" text-anchor="middle">Kafka</text>
  <text class="sub" x="260" y="772" text-anchor="middle">streaming</text>

  <!-- Orchestration -->
  <rect class="box" x="620" y="90" width="360" height="170" rx="22" stroke="#38bdf8"/>
  <text class="main" x="800" y="172" text-anchor="middle">Airflow</text>
  <text class="sub" x="800" y="222" text-anchor="middle">DAGs</text>
  <path d="M800 262V355" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrow-dash)"/>

  <!-- Processing -->
  <rect class="box" x="620" y="365" width="360" height="445" rx="26" stroke="#fb923c" stroke-width="5"/>
  <text class="hero" x="800" y="590" text-anchor="middle">Spark</text>
  <text class="sub" x="800" y="642" text-anchor="middle">batch + streaming</text>

  <path class="flow" d="M452 175C540 175 530 480 608 480"/>
  <path class="flow" d="M452 450C530 450 540 590 608 590"/>
  <path class="flow" d="M452 725C530 725 540 700 608 700"/>

  <!-- Storage -->
  <path class="flow" d="M982 590H1088"/>
  <rect x="1100" y="90" width="440" height="720" rx="26" fill="#0b1324" stroke="#22d3ee" stroke-width="5"/>
  <text class="main" x="1320" y="168" text-anchor="middle">Delta Lake</text>

  <rect x="1140" y="205" width="360" height="100" rx="18" fill="#451a03" stroke="#d97706" stroke-width="4"/>
  <text class="layer" x="1320" y="271" text-anchor="middle" fill="#fcd34d">Bronze</text>
  <path d="M1320 307V343" fill="none" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1140" y="350" width="360" height="100" rx="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
  <text class="layer" x="1320" y="416" text-anchor="middle" fill="#e2e8f0">Silver</text>
  <path d="M1320 452V488" fill="none" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1140" y="495" width="360" height="100" rx="18" fill="#422006" stroke="#facc15" stroke-width="4"/>
  <text class="layer" x="1320" y="561" text-anchor="middle" fill="#fde047">Gold</text>

  <rect x="1140" y="660" width="360" height="110" rx="18" fill="#0f172a" stroke="#f43f5e" stroke-width="4"/>
  <text class="layer" x="1320" y="731" text-anchor="middle" fill="#f8fafc">MinIO · S3</text>
</svg>
